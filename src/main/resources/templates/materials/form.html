<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vật tư')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid app-shell">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Thông tin vật tư</h1>
        <a class="btn btn-outline-secondary" th:href="@{/materials}">Quay lại</a>
    </div>

    <form th:action="@{/materials}" th:object="${material}" method="post" class="data-panel">
        <input type="hidden" th:field="*{id}">

        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Mã</label>
                <input class="form-control" th:field="*{code}" required>
                <div class="text-danger small" th:errors="*{code}"></div>
            </div>
            <div class="col-md-9">
                <label class="form-label">Tên</label>
                <input class="form-control" th:field="*{name}" required>
                <div class="text-danger small" th:errors="*{name}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Tên khác</label>
                <input class="form-control" th:field="*{aliasText}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Loại</label>
                <input class="form-control" th:field="*{category}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Đơn vị tính</label>
                <input class="form-control" th:field="*{unit}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Quy cách</label>
                <input class="form-control" th:field="*{packageSpec}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Tồn tối thiểu</label>
                <input class="form-control" type="number" min="0" th:field="*{minStock}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Tồn tối đa</label>
                <input class="form-control" type="number" min="0" th:field="*{maxStock}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Giá ước tính</label>
                <input class="form-control" type="number" min="0" step="1000" th:field="*{estimatedUnitPrice}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Trạng thái</label>
                <select class="form-select" th:field="*{status}">
                    <option value="ACTIVE">Đang sử dụng</option>
                    <option value="INACTIVE">Ngừng sử dụng</option>
                </select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{specialControl}">
                    <label class="form-check-label" th:for="${#ids.prev('specialControl')}">Kiểm soát đặc biệt</label>
                </div>
            </div>
            <div class="col-12">
                <label class="form-label">Điều kiện bảo quản</label>
                <input class="form-control" th:field="*{storageCondition}">
            </div>
            <div class="col-12 d-flex gap-2 justify-content-end">
                <a class="btn btn-outline-secondary" th:href="@{/materials}">Hủy</a>
                <button class="btn btn-primary">Lưu thay đổi</button>
            </div>
        </div>
    </form>
</main>
<div th:replace="~{fragments/layout :: chatbot}"></div>
</body>
</html>
