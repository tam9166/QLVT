<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tạo phiếu hủy')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container py-4"><h1 class="h3 mb-3">Tạo phiếu hủy vật tư</h1><form th:action="@{/destructions}" method="post" class="row g-3"><div class="col-md-8"><label class="form-label">Tồn cần hủy</label><select class="form-select" name="balanceId" required><option th:each="b:${balances}" th:value="${b.id}" th:text="${b.material.code + ' - ' + b.batch.batchNumber + ' - khả dụng ' + b.availableQuantity}"></option></select></div><div class="col-md-4"><label class="form-label">Số lượng hủy</label><input class="form-control" type="number" min="1" name="quantity" required></div><div class="col-md-4"><label class="form-label">Lý do</label><select class="form-select" name="reason"><option th:each="r:${reasons}" th:value="${r}" th:text="${r}"></option></select></div><div class="col-md-8"><label class="form-label">Ghi chú</label><input class="form-control" name="note"></div><div class="col-12"><button class="btn btn-primary">Tạo phiếu</button></div></form></main></body></html>
