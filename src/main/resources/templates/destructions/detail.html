<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết phiếu hủy')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-start mb-3 gap-3">
        <div>
            <h1 class="h3 mb-2" th:text="${item.destructionCode}">Phiếu hủy</h1>
            <span class="badge text-bg-danger" th:text="${item.status}">DRAFT</span>
            <div class="text-muted small mt-2">
                <span>Quản lý duyệt: </span><strong th:text="${item.managerApprovedBy ?: '-'}">-</strong>
                <span class="ms-3">Kế toán duyệt: </span><strong th:text="${item.accountantApprovedBy ?: '-'}">-</strong>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 justify-content-end">
            <form th:if="${item.canSubmit()}" th:action="@{/destructions/{id}/submit(id=${item.id})}" method="post">
                <button class="btn btn-outline-primary">Gửi duyệt</button>
            </form>
            <form th:if="${item.canApproveManager()}" th:action="@{/destructions/{id}/approve(id=${item.id})}" method="post" onsubmit="return confirm('Quản lý duyệt phiếu hủy?')">
                <button class="btn btn-success">Duyệt bước quản lý</button>
            </form>
            <form th:if="${item.canApproveAccountant()}" th:action="@{/destructions/{id}/approve-accountant(id=${item.id})}" method="post" onsubmit="return confirm('Kế toán duyệt bước 2 phiếu hủy?')">
                <button class="btn btn-warning">Kế toán duyệt bước 2</button>
            </form>
            <form th:if="${item.canDestroy()}" th:action="@{/destructions/{id}/destroy(id=${item.id})}" method="post" onsubmit="return confirm('Thực hiện hủy vật tư?')">
                <button class="btn btn-danger">Thực hiện hủy</button>
            </form>
        </div>
    </div>
    <table class="table table-hover">
        <thead>
        <tr><th>Vật tư</th><th>Lô</th><th>Kho</th><th>Vị trí</th><th>Số lượng</th><th>Lý do</th></tr>
        </thead>
        <tbody>
        <tr th:each="l:${item.lines}">
            <td th:text="${l.material.code + ' - ' + l.material.name}"></td>
            <td th:text="${l.batch.batchNumber}"></td>
            <td th:text="${l.warehouse.name}"></td>
            <td th:text="${l.location.code}"></td>
            <td th:text="${l.quantity}"></td>
            <td th:text="${l.reason}"></td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/attachments :: box(${attachmentType}, ${item.id}, ${'/destructions/' + item.id})}"></div>
</main>
</body>
</html>
