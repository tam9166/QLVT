<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Hủy vật tư')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid py-4"><div class="d-flex justify-content-between mb-3"><h1 class="h3">Hủy vật tư</h1><a class="btn btn-primary" th:href="@{/destructions/new}">Tạo phiếu hủy</a></div><table class="table table-hover"><thead><tr><th>Mã</th><th>Lý do</th><th>Trạng thái</th><th>Ngày tạo</th><th></th></tr></thead><tbody><tr th:each="i:${items}"><td><a th:href="@{/destructions/{id}(id=${i.id})}" th:text="${i.destructionCode}"></a></td><td th:text="${i.reason}"></td><td><span class="badge text-bg-danger" th:text="${i.status}"></span></td><td th:text="${#temporals.format(i.createdAt,'dd/MM/yyyy HH:mm')}"></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/destructions/{id}(id=${i.id})}">Chi tiết</a></td></tr></tbody></table></main></body></html>
