<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thông tin người dùng')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container app-shell">
    <section class="data-panel">
        <span class="eyebrow">Biểu mẫu người dùng</span>
        <h1 class="h3 mb-3">Thông tin người dùng</h1>
        <form th:action="@{/users}" th:object="${userForm}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}">
            <div class="col-md-4">
                <label class="form-label">Tên đăng nhập</label>
                <input class="form-control" th:field="*{username}">
                <div class="text-danger small" th:errors="*{username}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Mật khẩu</label>
                <input class="form-control" type="password" th:field="*{password}" placeholder="Để trống nếu không đổi">
                <div class="text-danger small" th:errors="*{password}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">Vai trò</label>
                <select class="form-select" th:field="*{role}">
                    <option value="">Chọn vai trò</option>
                    <option th:each="r:${roles}" th:value="${r.name()}" th:text="${r.label}"></option>
                </select>
                <div class="text-danger small" th:errors="*{role}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Họ tên</label>
                <input class="form-control" th:field="*{fullName}">
                <div class="text-danger small" th:errors="*{fullName}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Email</label>
                <input class="form-control" th:field="*{email}">
                <div class="text-danger small" th:errors="*{email}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Điện thoại</label>
                <input class="form-control" th:field="*{phone}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Khoa/phòng</label>
                <select class="form-select" th:field="*{department}">
                    <option value="">Không gán</option>
                    <option th:each="d:${departments}" th:value="${d.name}" th:text="${d.code + ' - ' + d.name}"></option>
                </select>
                <div class="text-danger small" th:errors="*{department}"></div>
            </div>
            <div class="col-12 form-check ms-2">
                <input class="form-check-input" type="checkbox" th:field="*{enabled}">
                <label class="form-check-label">Cho phép đăng nhập</label>
            </div>
            <div class="col-12">
                <button class="btn btn-primary">Lưu</button>
                <a class="btn btn-outline-light" th:href="@{/users}">Quay lại</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
