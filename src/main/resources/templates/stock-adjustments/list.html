<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Điều chỉnh tồn')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid py-4"><div class="d-flex justify-content-between mb-3"><h1 class="h3">Điều chỉnh tồn</h1><a class="btn btn-primary" th:href="@{/stock-adjustments/new}">Tạo thủ công</a></div><table class="table table-hover"><thead><tr><th>Mã</th><th>Kho</th><th>Lý do</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="i:${items}"><td><a th:href="@{/stock-adjustments/{id}(id=${i.id})}" th:text="${i.adjustmentCode}"></a></td><td th:text="${i.warehouse.name}"></td><td th:text="${i.reason}"></td><td><span class="badge text-bg-info" th:text="${i.status}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/stock-adjustments/{id}(id=${i.id})}">Chi tiết</a></td></tr></tbody></table></main></body></html>
