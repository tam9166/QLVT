<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết điều chỉnh')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-start mb-3 gap-3">
        <div>
            <h1 class="h3 mb-2" th:text="${item.adjustmentCode}">Phiếu điều chỉnh</h1>
            <span class="badge text-bg-info" th:text="${item.status}">DRAFT</span>
            <div class="text-muted small mt-2">
                <span>Quản lý duyệt: </span><strong th:text="${item.managerApprovedBy ?: '-'}">-</strong>
                <span class="ms-3">Kế toán duyệt: </span><strong th:text="${item.accountantApprovedBy ?: '-'}">-</strong>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 justify-content-end">
            <form th:if="${item.canSubmit()}" th:action="@{/stock-adjustments/{id}/submit(id=${item.id})}" method="post">
                <button class="btn btn-outline-primary">Gửi duyệt</button>
            </form>
            <form th:if="${item.canApproveManager()}" th:action="@{/stock-adjustments/{id}/approve(id=${item.id})}" method="post" onsubmit="return confirm('Quản lý duyệt phiếu điều chỉnh?')">
                <button class="btn btn-success">Duyệt bước quản lý</button>
            </form>
            <form th:if="${item.canApproveAccountant()}" th:action="@{/stock-adjustments/{id}/approve-accountant(id=${item.id})}" method="post" onsubmit="return confirm('Kế toán duyệt bước 2 và áp dụng điều chỉnh?')">
                <button class="btn btn-warning">Kế toán duyệt bước 2</button>
            </form>
            <form th:if="${item.canReject()}" th:action="@{/stock-adjustments/{id}/reject(id=${item.id})}" method="post" class="d-flex gap-2">
                <input class="form-control" name="reason" required maxlength="1000" placeholder="Lý do từ chối">
                <button class="btn btn-outline-danger" onclick="return confirm('Từ chối phiếu điều chỉnh này?')">Từ chối</button>
            </form>
            <form th:if="${item.canCancel()}" th:action="@{/stock-adjustments/{id}/cancel(id=${item.id})}" method="post" class="d-flex gap-2">
                <input class="form-control" name="reason" required maxlength="1000" placeholder="Lý do hủy">
                <button class="btn btn-outline-danger" onclick="return confirm('Hủy phiếu điều chỉnh này?')">Hủy phiếu</button>
            </form>
        </div>
    </div>
    <div class="alert alert-danger" th:if="${item.rejectedReason != null and !item.rejectedReason.isBlank()}">
        <strong>Lý do từ chối:</strong> <span th:text="${item.rejectedReason}"></span>
        <span class="ms-2 text-muted" th:if="${item.rejectedBy != null}" th:text="${'Bởi ' + item.rejectedBy}"></span>
    </div>
    <table class="table table-hover">
        <thead>
        <tr><th>Vật tư</th><th>Lô</th><th>Vị trí</th><th>Hệ thống</th><th>Thực tế</th><th>Điều chỉnh</th></tr>
        </thead>
        <tbody>
        <tr th:each="l:${item.lines}">
            <td th:text="${l.material.code + ' - ' + l.material.name}"></td>
            <td th:text="${l.batch.batchNumber}"></td>
            <td th:text="${l.location.code}"></td>
            <td th:text="${l.systemQuantity}"></td>
            <td th:text="${l.actualQuantity}"></td>
            <td th:text="${l.adjustmentQuantity}"></td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/attachments :: box(${attachmentType}, ${item.id}, ${'/stock-adjustments/' + item.id})}"></div>
</main>
</body>
</html>
