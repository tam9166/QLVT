<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tạo điều chỉnh')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container py-4"><h1 class="h3 mb-3">Tạo điều chỉnh tồn thủ công</h1><form th:action="@{/stock-adjustments}" method="post" class="row g-3"><div class="col-md-8"><label class="form-label">Tồn cần điều chỉnh</label><select class="form-select" name="balanceId" required><option th:each="b:${balances}" th:value="${b.id}" th:text="${b.material.code + ' - ' + b.batch.batchNumber + ' - ' + b.warehouse.name + ' - hiện có ' + b.actualQuantity}"></option></select></div><div class="col-md-4"><label class="form-label">Số lượng thực tế</label><input class="form-control" type="number" min="0" name="actualQuantity" required></div><div class="col-12"><label class="form-label">Lý do</label><input class="form-control" name="reason"></div><div class="col-12"><button class="btn btn-primary">Tạo phiếu</button></div></form></main></body></html>
