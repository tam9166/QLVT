<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giá nhập theo vật tư')}"></head>
<body><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid py-4">
    <h1 class="h3" th:text="${material.code + ' - ' + material.name}"></h1>
    <div class="row g-3 my-3">
        <div class="col-md-4"><div class="panel-card"><div class="text-muted">Giá thấp nhất</div><div class="h4" th:text="${minPrice ?: 0}"></div></div></div>
        <div class="col-md-4"><div class="panel-card"><div class="text-muted">Giá cao nhất</div><div class="h4" th:text="${maxPrice ?: 0}"></div></div></div>
        <div class="col-md-4"><div class="panel-card"><div class="text-muted">Giá trung bình</div><div class="h4" th:text="${averagePrice ?: 0}"></div></div></div>
    </div>
    <table class="table table-hover"><thead><tr><th>Ngày nhập</th><th>Nhà cung cấp</th><th>Phiếu nhập</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead>
        <tbody><tr th:each="i:${items}"><td th:text="${i.receivedDate != null ? #temporals.format(i.receivedDate,'dd/MM/yyyy') : '-'}"></td><td th:text="${i.supplier != null ? i.supplier.name : '-'}"></td><td th:text="${i.receipt.receiptCode}"></td><td th:text="${i.quantity}"></td><td th:text="${i.unitPrice}"></td><td th:text="${i.totalAmount}"></td></tr></tbody></table>
</main></body></html>
