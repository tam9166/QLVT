<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nhập kho')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4">
    <h1 class="h3 mb-3">Phiếu nhập kho</h1>
    <form th:action="@{/stock/receive}" method="post" class="row g-3">
        <div class="col-md-6"><label class="form-label">Vật tư</label><select class="form-select" name="materialId" required><option th:each="m:${materials}" th:value="${m.id}" th:text="${m.code + ' - ' + m.name}"></option></select></div>
        <div class="col-md-6"><label class="form-label">Kho</label><select class="form-select" name="warehouseId" required><option th:each="w:${warehouses}" th:value="${w.id}" th:text="${w.name}"></option></select></div>
        <div class="col-md-4"><label class="form-label">Vị trí</label><select class="form-select" name="locationId"><option value="">Không chọn</option><option th:each="l:${locations}" th:value="${l.id}" th:text="${l.code + ' - ' + l.name}"></option></select></div>
        <div class="col-md-4"><label class="form-label">Nhà cung cấp</label><select class="form-select" name="supplierId"><option value="">Không chọn</option><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select></div>
        <div class="col-md-4"><label class="form-label">Số lô</label><input class="form-control" name="batchNumber" required></div>
        <div class="col-md-4"><label class="form-label">Hạn sử dụng</label><input class="form-control" type="date" name="expiryDate"></div>
        <div class="col-md-4"><label class="form-label">Số lượng</label><input class="form-control" type="number" min="1" name="quantity" required></div>
        <div class="col-12"><button class="btn btn-primary">Xác nhận nhập</button> <a class="btn btn-secondary" th:href="@{/stock}">Quay lại</a></div>
    </form>
</main>
</body>
</html>
