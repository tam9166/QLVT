<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nhật ký hệ thống')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid app-shell">
    <section class="data-panel">
        <span class="eyebrow">Nhật ký hệ thống</span>
        <h1 class="h3 mb-3">Nhật ký hệ thống</h1>
        <form class="row g-2 mb-3">
            <div class="col-md-3"><input class="form-control" name="actor" th:value="${actor}" placeholder="Người thao tác"></div>
            <div class="col-md-3"><input class="form-control" name="action" th:value="${action}" placeholder="Hành động"></div>
            <div class="col-md-3"><input class="form-control" name="entity" th:value="${entity}" placeholder="Đối tượng"></div>
            <div class="col-auto"><button class="btn btn-outline-light">Lọc</button></div>
        </form>
        <div class="table-responsive">
            <table class="table table-modern align-middle">
                <thead><tr><th>Thời gian</th><th>Người thao tác</th><th>Hành động</th><th>Đối tượng</th><th>ID</th><th>Chi tiết</th></tr></thead>
                <tbody>
                <tr th:each="a:${auditLogs}">
                    <td class="font-mono" th:text="${#temporals.format(a.createdAt,'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${a.actorUsername}"></td>
                    <td><span class="code-pill" th:text="${a.action}"></span></td>
                    <td th:text="${a.entityName}"></td>
                    <td th:text="${a.entityId}"></td>
                    <td th:text="${a.detail}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
