<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết chuyển kho')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid py-4"><div class="d-flex justify-content-between mb-3"><div><h1 class="h3" th:text="${item.transferCode}"></h1><span class="badge text-bg-info" th:text="${item.status}"></span></div><div class="d-flex gap-2"><form th:action="@{/stock-transfers/{id}/submit(id=${item.id})}" method="post"><button class="btn btn-outline-primary">Gửi duyệt</button></form><form th:action="@{/stock-transfers/{id}/approve(id=${item.id})}" method="post" onsubmit="return confirm('Duyệt chuyển kho?')"><button class="btn btn-success">Duyệt</button></form><form th:action="@{/stock-transfers/{id}/transfer(id=${item.id})}" method="post" onsubmit="return confirm('Thực hiện chuyển kho?')"><button class="btn btn-warning">Thực hiện chuyển</button></form><form th:action="@{/stock-transfers/{id}/receive(id=${item.id})}" method="post"><button class="btn btn-primary">Xác nhận nhận</button></form></div></div><table class="table table-hover"><thead><tr><th>Vật tư</th><th>Lô</th><th>Từ vị trí</th><th>Đến vị trí</th><th>Số lượng</th></tr></thead><tbody><tr th:each="l:${item.lines}"><td th:text="${l.material.code + ' - ' + l.material.name}"></td><td th:text="${l.batch.batchNumber}"></td><td th:text="${l.fromLocation.code}"></td><td th:text="${l.toLocation.code}"></td><td th:text="${l.quantity}"></td></tr></tbody></table></main></body></html>
