<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tạo chuyển kho')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container py-4"><h1 class="h3 mb-3">Tạo phiếu chuyển kho</h1><form th:action="@{/stock-transfers}" method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Kho đi</label><select class="form-select" name="fromWarehouseId" required><option th:each="w:${warehouses}" th:value="${w.id}" th:text="${w.name}"></option></select></div><div class="col-md-6"><label class="form-label">Kho đến</label><select class="form-select" name="toWarehouseId" required><option th:each="w:${warehouses}" th:value="${w.id}" th:text="${w.name}"></option></select></div><div class="col-md-8"><label class="form-label">Tồn nguồn</label><select class="form-select" name="balanceId" required><option th:each="b:${balances}" th:value="${b.id}" th:text="${b.material.code + ' - ' + b.batch.batchNumber + ' - ' + b.warehouse.name + ' - khả dụng ' + b.availableQuantity}"></option></select></div><div class="col-md-4"><label class="form-label">Vị trí đến</label><select class="form-select" name="toLocationId" required><option th:each="l:${locations}" th:value="${l.id}" th:text="${l.code + ' - ' + l.name}"></option></select></div><div class="col-md-4"><label class="form-label">Số lượng</label><input class="form-control" type="number" min="1" name="quantity" required></div><div class="col-md-8"><label class="form-label">Lý do</label><input class="form-control" name="reason"></div><div class="col-12"><button class="btn btn-primary">Tạo phiếu</button></div></form></main></body></html>
