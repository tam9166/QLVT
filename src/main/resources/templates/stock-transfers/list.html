<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chuyển kho')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid py-4"><div class="d-flex justify-content-between mb-3"><h1 class="h3">Chuyển kho nội bộ</h1><a class="btn btn-primary" th:href="@{/stock-transfers/new}">Tạo phiếu chuyển</a></div><table class="table table-hover"><thead><tr><th>Mã</th><th>Kho đi</th><th>Kho đến</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="i:${items}"><td><a th:href="@{/stock-transfers/{id}(id=${i.id})}" th:text="${i.transferCode}"></a></td><td th:text="${i.fromWarehouse.name}"></td><td th:text="${i.toWarehouse.name}"></td><td><span class="badge text-bg-info" th:text="${i.status}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/stock-transfers/{id}(id=${i.id})}">Chi tiết</a></td></tr></tbody></table></main></body></html>
