<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Chi tiết phiếu nhập')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid app-shell">
    <section class="data-panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <span class="eyebrow">Phiếu nhập kho</span>
                <h1 class="h3 mb-1" th:text="${receipt.receiptCode}"></h1>
                <span class="badge text-bg-info" th:text="${receipt.status}"></span>
            </div>
            <div class="d-flex gap-2 flex-wrap justify-content-end">
                <a class="btn btn-outline-light" th:href="@{/receipts}">Quay lại</a>
                <a class="btn btn-outline-light" th:if="${receipt.status.name() == 'DRAFT'}" th:href="@{/receipts/{id}/edit(id=${receipt.id})}">
                    <i class="bi bi-pencil-square"></i> Sửa phiếu
                </a>
                <a class="btn btn-outline-light" th:href="@{/receipts/{id}/invoice.pdf(id=${receipt.id})}">
                    <i class="bi bi-file-earmark-pdf"></i> Xuất hóa đơn PDF
                </a>
                <form th:if="${receipt.status.name() == 'DRAFT'}" th:action="@{/receipts/{id}/confirm(id=${receipt.id})}" method="post">
                    <button class="btn btn-primary"><i class="bi bi-check2-circle"></i> Xác nhận nhập</button>
                </form>
                <form sec:authorize="hasRole('ADMIN')"
                      th:action="@{/receipts/{id}/delete(id=${receipt.id})}"
                      method="post"
                      onsubmit="return confirm('Xóa phiếu nhập này? Nếu phiếu đã xác nhận, hệ thống sẽ đảo tồn trước khi xóa.')">
                    <button class="btn btn-danger"><i class="bi bi-trash3"></i> Xóa phiếu</button>
                </form>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-3">
                <div class="metric-card">
                    <span class="metric-label">Kho</span>
                    <strong th:text="${receipt.warehouse != null ? receipt.warehouse.name : '-'}"></strong>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <span class="metric-label">Nhà cung cấp</span>
                    <strong th:text="${receipt.supplier != null ? receipt.supplier.name : '-'}"></strong>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <span class="metric-label">Ngày nhập</span>
                    <strong th:text="${receipt.receiptDate != null ? #temporals.format(receipt.receiptDate, 'dd/MM/yyyy') : '-'}"></strong>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <span class="metric-label">Người tạo</span>
                    <strong th:text="${receipt.createdBy ?: '-'}"></strong>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-modern align-middle">
                <thead>
                <tr>
                    <th>Vật tư</th>
                    <th>Số lô</th>
                    <th>Vị trí</th>
                    <th>Hạn dùng</th>
                    <th>Số lượng</th>
                    <th>Đơn giá</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="l:${lines}">
                    <td th:text="${l.material.code + ' - ' + l.material.name}"></td>
                    <td th:text="${l.batchNumber}"></td>
                    <td th:text="${l.location != null ? l.location.code : '-'}"></td>
                    <td th:text="${l.expiryDate != null ? #temporals.format(l.expiryDate, 'dd/MM/yyyy') : '-'}"></td>
                    <td th:text="${l.quantity}"></td>
                    <td th:text="${l.unitPrice}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(lines)}">
                    <td colspan="6" class="text-center text-muted py-4">Chưa có dòng vật tư trong phiếu nhập.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
    <div th:replace="~{fragments/attachments :: box(${attachmentType}, ${receipt.id}, ${'/receipts/' + receipt.id})}"></div>
</main>
<div th:replace="~{fragments/layout :: chatbot}"></div>
</body>
</html>
