<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tạo phiếu nhập')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid app-shell">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-1">Tạo phiếu nhập kho</h1>
            <p class="text-secondary mb-0">Mã phiếu và số lô được tự động cấp theo thứ tự PN-1, PN-2 và LO-1, LO-2...</p>
        </div>
        <a class="btn btn-outline-light" th:href="@{/receipts}">Quay lại</a>
    </div>

    <form th:action="@{/receipts}" method="post" class="data-panel">
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label">Kho nhập</label>
                <select class="form-select" name="warehouseId" required>
                    <option th:each="w:${warehouses}" th:value="${w.id}" th:text="${w.name}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Nhà cung cấp</label>
                <select class="form-select" name="supplierId">
                    <option value="">Không chọn</option>
                    <option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Ghi chú chung</label>
                <input class="form-control" name="note" placeholder="Ghi chú phiếu nhập">
            </div>
        </div>

        <div id="receiptLines" class="d-grid gap-3">
            <div class="receipt-line border-top pt-3">
                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label">Vật tư</label>
                        <select class="form-select" name="materialId" required>
                            <option th:each="m:${materials}" th:value="${m.id}" th:text="${m.code + ' - ' + m.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Vị trí</label>
                        <select class="form-select" name="locationId" required>
                            <option th:each="l:${locations}" th:value="${l.id}" th:text="${l.code + ' - ' + l.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Số lượng nhập</label>
                        <input class="form-control" type="number" min="1" name="quantity" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Ngày sản xuất</label>
                        <input class="form-control" type="date" name="manufactureDate">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Hạn dùng</label>
                        <input class="form-control" type="date" name="expiryDate">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Đơn giá</label>
                        <input class="form-control" type="number" min="0" name="unitPrice" value="0">
                    </div>
                    <div class="col-md-3 d-flex align-items-end justify-content-end">
                        <button class="btn btn-outline-light remove-line" type="button">Xóa dòng</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button class="btn btn-outline-light" id="addReceiptLine" type="button">Thêm vật tư</button>
            <button class="btn btn-primary">Lưu phiếu nhập</button>
        </div>
    </form>
</main>
<div th:replace="~{fragments/layout :: chatbot}"></div>
<script>
    const lines = document.getElementById('receiptLines');
    const addButton = document.getElementById('addReceiptLine');

    function bindRemoveButtons() {
        document.querySelectorAll('.remove-line').forEach(button => {
            button.onclick = () => {
                if (document.querySelectorAll('.receipt-line').length > 1) {
                    button.closest('.receipt-line').remove();
                }
            };
        });
    }

    addButton.addEventListener('click', () => {
        const first = document.querySelector('.receipt-line');
        const clone = first.cloneNode(true);
        clone.querySelectorAll('input').forEach(input => {
            input.value = input.name === 'unitPrice' ? '0' : '';
        });
        lines.appendChild(clone);
        bindRemoveButtons();
    });
    bindRemoveButtons();
</script>
</body>
</html>
