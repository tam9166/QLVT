<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quên mật khẩu QLVT')}"></head>
<body class="login-page">
<div class="void-grid" aria-hidden="true"></div>
<main class="login-shell">
    <section class="login-visual">
        <span class="eyebrow"><span class="live-dot"></span> Bảo mật tài khoản</span>
        <h1>QLVT <span>2026</span></h1>
        <div class="login-highlights">
            <span><i class="bi bi-shield-lock"></i> Mật khẩu tạm</span>
            <span><i class="bi bi-person-check"></i> Admin duyệt</span>
            <span><i class="bi bi-clock-history"></i> Nhật ký audit</span>
        </div>
    </section>
    <section class="login-card">
        <span class="brand-mark large"><i class="bi bi-key"></i></span>
        <span class="eyebrow mt-4">Khôi phục truy cập</span>
        <h2>Yêu cầu reset mật khẩu</h2>

        <div th:if="${submitted}" class="alert alert-success py-2">
            Nếu thông tin khớp với tài khoản đang hoạt động, quản trị viên sẽ nhận yêu cầu cấp mật khẩu tạm.
        </div>

        <form th:action="@{/forgot-password}" method="post" class="vstack gap-3">
            <div>
                <label class="form-label">Tên đăng nhập hoặc email</label>
                <input class="form-control form-control-lg" name="lookup" maxlength="160" autocomplete="username" autofocus required>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit">Gửi yêu cầu</button>
        </form>
        <div class="mt-4 text-center">
            <a th:href="@{/login}" class="text-decoration-none">Quay lại đăng nhập</a>
        </div>
    </section>
</main>
</body>
</html>
