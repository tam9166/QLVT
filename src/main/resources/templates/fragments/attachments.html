<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="box(referenceType, referenceId, redirectUrl)" class="panel-card mt-4">
    <div class="panel-heading"><h2>File chứng từ, hình ảnh, biên bản</h2></div>
    <form class="row g-2 align-items-end" th:action="@{/attachments/{type}/{id}(type=${referenceType},id=${referenceId})}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="redirect" th:value="${redirectUrl}">
        <div class="col-md-5"><label class="form-label">File</label><input class="form-control" type="file" name="file" required></div>
        <div class="col-md-5"><label class="form-label">Ghi chú</label><input class="form-control" name="note" placeholder="Hóa đơn, biên bản, hình ảnh..."></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Tải lên</button></div>
    </form>
    <table class="table table-hover align-middle mt-3">
        <thead><tr><th>Tên file</th><th>Loại</th><th>Dung lượng</th><th>Người tải</th><th>Ngày tải</th><th></th></tr></thead>
        <tbody>
        <tr th:each="a:${attachments}">
            <td th:text="${a.originalFileName}"></td>
            <td th:text="${a.contentType}"></td>
            <td th:text="${a.fileSize + ' bytes'}"></td>
            <td th:text="${a.uploadedBy}"></td>
            <td th:text="${#temporals.format(a.uploadedAt,'dd/MM/yyyy HH:mm')}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/attachments/{id}/download(id=${a.id})}">Tải xuống</a>
                <form class="d-inline" th:action="@{/attachments/{id}/delete(id=${a.id})}" method="post">
                    <input type="hidden" name="redirect" th:value="${redirectUrl}">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(attachments)}"><td colspan="6" class="text-muted">Chưa có file đính kèm.</td></tr>
        </tbody>
    </table>
</section>
</body>
</html>
