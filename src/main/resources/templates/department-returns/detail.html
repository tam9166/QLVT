<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết phiếu trả từ khoa')}"></head>
<body><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid py-4">
    <div class="d-flex justify-content-between mb-3">
        <div><h1 class="h3" th:text="${item.returnCode}"></h1><span class="badge text-bg-info" th:text="${item.status}"></span></div>
        <div class="d-flex gap-2">
            <form th:if="${item.canReceiveByWarehouse()}" th:action="@{/department-returns/{id}/receive(id=${item.id})}" method="post" onsubmit="return confirm('Kho xác nhận nhận lại vật tư?')"><button class="btn btn-success">Kho xác nhận nhận lại</button></form>
            <form th:if="${item.canRejectByWarehouse()}" th:action="@{/department-returns/{id}/reject(id=${item.id})}" method="post" class="d-flex gap-2">
                <input class="form-control" name="reason" required placeholder="Lý do từ chối">
                <button class="btn btn-outline-danger">Kho từ chối</button>
            </form>
            <form th:if="${canCancel}" th:action="@{/department-returns/{id}/cancel(id=${item.id})}" method="post" class="d-flex gap-2" onsubmit="return confirm('Hủy phiếu trả này?')">
                <input class="form-control" name="reason" required placeholder="Lý do hủy">
                <button class="btn btn-secondary">Hủy phiếu</button>
            </form>
        </div>
    </div>
    <div th:if="${item.reason != null and !item.reason.isBlank()}" class="alert alert-light border" style="white-space: pre-line" th:text="${item.reason}"></div>
    <table class="table table-hover"><thead><tr><th>Vật tư</th><th>Lô</th><th>Vị trí nhận</th><th>Số lượng</th><th>Ghi chú</th></tr></thead>
        <tbody><tr th:each="l:${item.lines}"><td th:text="${l.material.code + ' - ' + l.material.name}"></td><td th:text="${l.batch.batchNumber}"></td><td th:text="${l.location.code}"></td><td th:text="${l.quantity}"></td><td th:text="${l.note}"></td></tr></tbody></table>
    <div th:replace="~{fragments/attachments :: box(${attachmentType}, ${item.id}, ${'/department-returns/' + item.id})}"></div>
</main></body></html>
