<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thông tin kho')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container app-shell">
    <section class="data-panel">
        <span class="eyebrow">Warehouse form</span>
        <h1 class="h3 mb-3">Thông tin kho</h1>
        <form th:action="@{/warehouses}" th:object="${warehouseForm}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}">
            <div class="col-md-4"><label class="form-label">Mã kho</label><input class="form-control" th:field="*{code}"><div class="text-danger small" th:errors="*{code}"></div></div>
            <div class="col-md-8"><label class="form-label">Tên kho</label><input class="form-control" th:field="*{name}"><div class="text-danger small" th:errors="*{name}"></div></div>
            <div class="col-md-4"><label class="form-label">Loại kho</label><select class="form-select" th:field="*{type}"><option value="">Chọn loại</option><option th:each="t:${types}" th:value="${t}" th:text="${t}"></option></select><div class="text-danger small" th:errors="*{type}"></div></div>
            <div class="col-md-8"><label class="form-label">Địa chỉ/vị trí</label><input class="form-control" th:field="*{address}"></div>
            <div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" th:field="*{description}"></textarea></div>
            <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Đang hoạt động</label></div>
            <div class="col-12"><button class="btn btn-primary">Lưu</button> <a class="btn btn-outline-light" th:href="@{/warehouses}">Quay lại</a></div>
        </form>
    </section>
</main>
</body>
</html>
