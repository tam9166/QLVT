<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý kho')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid app-shell">
    <section class="data-panel">
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="panel-heading">
            <div><span class="eyebrow">Warehouse admin</span><h1 class="h3">Quản lý kho</h1></div>
            <a class="btn btn-primary" th:href="@{/warehouses/new}"><i class="bi bi-plus-lg"></i> Thêm kho</a>
        </div>
        <form class="row g-2 mb-3">
            <div class="col-md-5"><input class="form-control" name="q" th:value="${q}" placeholder="Tìm mã hoặc tên kho"></div>
            <div class="col-auto"><button class="btn btn-outline-light">Tìm</button></div>
        </form>
        <div class="table-responsive">
            <table class="table table-modern align-middle">
                <thead><tr><th>Mã</th><th>Tên kho</th><th>Loại</th><th>Địa chỉ</th><th>Trạng thái</th><th></th></tr></thead>
                <tbody>
                <tr th:each="w : ${warehouses}">
                    <td><span class="code-pill" th:text="${w.code}"></span></td>
                    <td th:text="${w.name}"></td>
                    <td th:text="${w.type}"></td>
                    <td th:text="${w.address}"></td>
                    <td th:text="${w.active ? 'Đang dùng' : 'Tạm ngưng'}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-light" th:href="@{/warehouses/{id}/edit(id=${w.id})}">Sửa</a>
                        <form class="d-inline" method="post" th:action="@{/warehouses/{id}/delete(id=${w.id})}" onsubmit="return confirm('Xóa mềm kho này?')"><button class="btn btn-sm btn-outline-light">Xóa</button></form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
