<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đơn đặt hàng')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid py-4"><h1 class="h3 mb-3">Đơn đặt hàng</h1><table class="table table-hover"><thead><tr><th>Mã</th><th>Nhà cung cấp</th><th>Dự kiến giao</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="i:${items}"><td><a th:href="@{/purchases/orders/{id}(id=${i.id})}" th:text="${i.orderCode}"></a></td><td th:text="${i.supplier != null ? i.supplier.name : '-'}"></td><td th:text="${i.expectedDeliveryDate}"></td><td><span class="badge text-bg-info" th:text="${i.status}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/purchases/orders/{id}(id=${i.id})}">Chi tiết</a></td></tr></tbody></table></main></body></html>
