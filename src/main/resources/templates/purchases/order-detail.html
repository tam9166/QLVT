<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết đơn hàng')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid py-4"><h1 class="h3" th:text="${item.orderCode}"></h1><span class="badge text-bg-info" th:text="${item.status}"></span><table class="table table-hover mt-3"><thead><tr><th>Vật tư</th><th>Đặt</th><th>Đã nhận</th><th>Đơn giá</th></tr></thead><tbody><tr th:each="l:${item.lines}"><td th:text="${l.material.code + ' - ' + l.material.name}"></td><td th:text="${l.orderedQuantity}"></td><td th:text="${l.receivedQuantity}"></td><td th:text="${l.unitPrice}"></td></tr></tbody></table></main></body></html>
