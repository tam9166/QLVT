<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết đơn hàng')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
        <div>
            <h1 class="h3 mb-1" th:text="${item.orderCode}"></h1>
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <span class="badge text-bg-info" th:text="${item.status}"></span>
                <span class="text-muted" th:if="${item.supplier != null}" th:text="${item.supplier.name}"></span>
                <span class="text-muted" th:if="${item.expectedDeliveryDate != null}" th:text="${'Dự kiến: ' + item.expectedDeliveryDate}"></span>
            </div>
        </div>
        <form th:if="${item.status.name() == 'DRAFT'}" th:action="@{/purchases/orders/{id}/send(id=${item.id})}" method="post">
            <button class="btn btn-primary">Gửi nhà cung cấp</button>
        </form>
    </div>

    <form th:action="@{/purchases/orders/{id}/receive(id=${item.id})}" method="post">
        <div class="row g-3 mb-3" th:if="${item.status.name() == 'SENT' || item.status.name() == 'PARTIALLY_RECEIVED'}">
            <div class="col-md-4">
                <label class="form-label">Kho nhập</label>
                <select class="form-select" name="warehouseId" required>
                    <option value="">Chọn kho</option>
                    <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.code + ' - ' + w.name}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Vị trí nhập</label>
                <select class="form-select" name="locationId" required>
                    <option value="">Chọn vị trí</option>
                    <option th:each="loc : ${locations}"
                            th:value="${loc.id}"
                            th:text="${loc.code + ' - ' + loc.name + (loc.warehouse != null ? ' (' + loc.warehouse.code + ')' : '')}"></option>
                </select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <div class="text-muted small">Sau khi ghi nhận, hệ thống tạo phiếu nhập nháp để kiểm tra và xác nhận nhập kho.</div>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Vật tư</th>
                    <th class="text-end">Đặt</th>
                    <th class="text-end">Đã nhận</th>
                    <th class="text-end">Còn lại</th>
                    <th class="text-end">Đơn giá</th>
                    <th style="width: 180px;">Nhận thêm</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="l : ${item.lines}">
                    <td th:text="${l.material.code + ' - ' + l.material.name}"></td>
                    <td class="text-end" th:text="${l.orderedQuantity}"></td>
                    <td class="text-end" th:text="${l.receivedQuantity}"></td>
                    <td class="text-end" th:text="${l.orderedQuantity - l.receivedQuantity}"></td>
                    <td class="text-end" th:text="${l.unitPrice}"></td>
                    <td>
                        <input class="form-control form-control-sm"
                               type="number"
                               min="0"
                               th:max="${l.orderedQuantity - l.receivedQuantity}"
                               th:name="${'received_' + l.id}"
                               th:disabled="${item.status.name() == 'DRAFT' || item.status.name() == 'RECEIVED' || item.status.name() == 'CANCELLED' || l.orderedQuantity <= l.receivedQuantity}"
                               value="0">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <button class="btn btn-success"
                th:if="${item.status.name() == 'SENT' || item.status.name() == 'PARTIALLY_RECEIVED'}">
            Ghi nhận nhận hàng
        </button>
        <a class="btn btn-outline-secondary" th:href="@{/purchases/orders}">Quay lại</a>
    </form>
</main>
</body>
</html>
