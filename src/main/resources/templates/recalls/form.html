<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tạo thu hồi')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container py-4"><h1 class="h3 mb-3">Tạo lệnh thu hồi</h1><form th:action="@{/recalls}" method="post" class="row g-3"><div class="col-md-8"><label class="form-label">Lô</label><select class="form-select" name="batchId" required><option th:each="b:${batches}" th:value="${b.id}" th:text="${b.batchNumber + ' - ' + b.material.name}"></option></select></div><div class="col-md-4"><label class="form-label">Lý do</label><input class="form-control" name="reason" required></div><div class="col-12"><button class="btn btn-primary">Tạo lệnh</button></div></form></main></body></html>
