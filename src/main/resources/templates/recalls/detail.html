<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết thu hồi')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid py-4"><div class="d-flex justify-content-between mb-3"><div><h1 class="h3" th:text="${item.recallCode}"></h1><span class="badge text-bg-warning" th:text="${item.status}"></span></div><div class="d-flex gap-2"><form th:action="@{/recalls/{id}/activate(id=${item.id})}" method="post" onsubmit="return confirm('Kích hoạt thu hồi và khóa lô?')"><button class="btn btn-warning">Kích hoạt</button></form><form th:action="@{/recalls/{id}/complete(id=${item.id})}" method="post"><button class="btn btn-success">Hoàn tất</button></form></div></div><table class="table table-hover"><thead><tr><th>Khoa</th><th>Đã cấp</th><th>Còn lại</th><th>Trả về</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="l:${item.lines}"><td th:text="${l.department}"></td><td th:text="${l.issuedQuantity}"></td><td th:text="${l.remainingQuantity}"></td><td th:text="${l.returnedQuantity}"></td><td th:text="${l.status}"></td></tr></tbody></table><h2 class="h5 mt-4">Khoa phản hồi</h2><form th:action="@{/recalls/{id}/department-response(id=${item.id})}" method="post" class="row g-2"><div class="col-md-3"><input class="form-control" name="department" placeholder="Khoa" required></div><div class="col-md-2"><input class="form-control" type="number" min="0" name="remainingQuantity" placeholder="Còn"></div><div class="col-md-2"><input class="form-control" type="number" min="0" name="usedQuantity" placeholder="Đã dùng"></div><div class="col-md-2"><input class="form-control" type="number" min="0" name="returnedQuantity" placeholder="Trả"></div><div class="col-md-3"><button class="btn btn-primary">Gửi phản hồi</button></div></form></main></body></html>
