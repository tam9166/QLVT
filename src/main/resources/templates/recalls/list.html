<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Thu hồi vật tư')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid py-4"><div class="d-flex justify-content-between mb-3"><h1 class="h3">Thu hồi vật tư theo lô</h1><a class="btn btn-primary" th:href="@{/recalls/new}">Tạo thu hồi</a></div><table class="table table-hover"><thead><tr><th>Mã</th><th>Lô</th><th>Vật tư</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="i:${items}"><td><a th:href="@{/recalls/{id}(id=${i.id})}" th:text="${i.recallCode}"></a></td><td th:text="${i.batch.batchNumber}"></td><td th:text="${i.material.name}"></td><td><span class="badge text-bg-warning" th:text="${i.status}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/recalls/{id}(id=${i.id})}">Chi tiết</a></td></tr></tbody></table></main></body></html>
