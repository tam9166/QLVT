<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Báo cáo')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid app-shell">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Báo cáo nhập - xuất - tồn</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light" th:href="@{/reports/stock.csv}">Xuất CSV tồn kho</a>
            <a class="btn btn-outline-light" th:href="@{/reports/movements.csv}">Xuất CSV biến động</a>
            <a class="btn btn-primary" th:href="@{/reports/advanced}">Báo cáo nâng cao</a>
        </div>
    </div>
    <section class="data-panel mb-4">
        <h2 class="h5">Tồn kho hiện tại</h2>
        <div class="table-responsive">
            <table class="table table-modern align-middle">
                <thead><tr><th>Mã</th><th>Tên</th><th>Tồn</th><th>Khả dụng</th><th>Giá ước tính</th></tr></thead>
                <tbody>
                <tr th:each="m:${materials}">
                    <td th:text="${m.code}"></td>
                    <td th:text="${m.name}"></td>
                    <td th:text="${m.actualQuantity}"></td>
                    <td th:text="${m.availableQuantity}"></td>
                    <td th:text="${m.estimatedUnitPrice}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
    <section class="data-panel">
        <h2 class="h5">Nhật ký hệ thống</h2>
        <div class="table-responsive">
            <table class="table table-modern align-middle">
                <thead><tr><th>Thời gian</th><th>Người dùng</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead>
                <tbody>
                <tr th:each="a:${auditLogs}">
                    <td th:text="${#temporals.format(a.createdAt,'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${a.actorUsername}"></td>
                    <td th:text="${a.action}"></td>
                    <td th:text="${a.entityId}"></td>
                    <td th:text="${a.detail}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
