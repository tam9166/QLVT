<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Báo cáo nâng cao')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div><main class="container-fluid py-4"><h1 class="h3 mb-3">Báo cáo nâng cao</h1><div class="row g-3 mb-4"><div class="col-md-3"><div class="metric-card"><span>Vật tư</span><strong th:text="${materials.size()}"></strong></div></div><div class="col-md-3"><div class="metric-card"><span>Tồn theo lô</span><strong th:text="${balances.size()}"></strong></div></div><div class="col-md-3"><div class="metric-card"><span>Sắp hết hạn</span><strong th:text="${expiringBatches.size()}"></strong></div></div><div class="col-md-3"><div class="metric-card"><span>Đơn hàng trễ</span><strong th:text="${lateOrders.size()}"></strong></div></div></div>
<h2 class="h5">Tồn kho hiện tại theo lô</h2><table class="table table-sm table-hover"><thead><tr><th>Vật tư</th><th>Lô</th><th>Kho</th><th>Tồn</th><th>Khả dụng</th></tr></thead><tbody><tr th:each="b:${balances}"><td th:text="${b.material.code + ' - ' + b.material.name}"></td><td th:text="${b.batch.batchNumber}"></td><td th:text="${b.warehouse.name}"></td><td th:text="${b.actualQuantity}"></td><td th:text="${b.availableQuantity}"></td></tr></tbody></table>
<h2 class="h5 mt-4">Lô sắp hết hạn</h2><table class="table table-sm table-hover"><thead><tr><th>Lô</th><th>Vật tư</th><th>HSD</th><th>Tồn</th></tr></thead><tbody><tr th:each="b:${expiringBatches}"><td th:text="${b.batchNumber}"></td><td th:text="${b.material.name}"></td><td th:text="${b.expiryDate}"></td><td th:text="${b.quantity}"></td></tr></tbody></table>
<h2 class="h5 mt-4">Kiểm kê chênh lệch</h2><table class="table table-sm table-hover"><thead><tr><th>Mã</th><th>Kho</th><th>Trạng thái</th><th>Dòng</th></tr></thead><tbody><tr th:each="c:${counts}"><td th:text="${c.countCode}"></td><td th:text="${c.warehouse.name}"></td><td th:text="${c.status}"></td><td th:text="${c.lines.size()}"></td></tr></tbody></table>
<h2 class="h5 mt-4">Hủy và thu hồi</h2><div class="row"><div class="col-md-6"><table class="table table-sm"><thead><tr><th>Phiếu hủy</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="d:${destructions}"><td th:text="${d.destructionCode}"></td><td th:text="${d.status}"></td></tr></tbody></table></div><div class="col-md-6"><table class="table table-sm"><thead><tr><th>Thu hồi</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="r:${recalls}"><td th:text="${r.recallCode}"></td><td th:text="${r.status}"></td></tr></tbody></table></div></div></main></body></html>
