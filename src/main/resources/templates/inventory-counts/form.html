<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tạo kiểm kê')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4"><h1 class="h3 mb-3">Tạo kiểm kê kho</h1><form th:action="@{/inventory-counts}" method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Kho</label><select class="form-select" name="warehouseId" required><option th:each="w:${warehouses}" th:value="${w.id}" th:text="${w.name}"></option></select></div><div class="col-md-6"><label class="form-label">Ghi chú</label><input class="form-control" name="note"></div><div class="col-12"><button class="btn btn-primary">Tạo và lấy tồn hệ thống</button></div></form></main></body></html>
