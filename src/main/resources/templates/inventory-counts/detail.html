<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết kiểm kê')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid py-4"><div class="d-flex justify-content-between mb-3"><div><h1 class="h3" th:text="${item.countCode}"></h1><span class="badge text-bg-info" th:text="${item.status}"></span></div><div class="d-flex gap-2"><a th:if="${item.canEditLines()}" class="btn btn-outline-primary" th:href="@{/inventory-counts/{id}/lines(id=${item.id})}">Nhập kết quả</a><form th:if="${item.canComplete()}" th:action="@{/inventory-counts/{id}/complete(id=${item.id})}" method="post" onsubmit="return confirm('Hoàn tất kiểm kê?')"><button class="btn btn-success">Hoàn tất</button></form><a th:if="${adjustment != null}" class="btn btn-outline-warning" th:href="@{/stock-adjustments/{id}(id=${adjustment.id})}" th:text="${'Xem điều chỉnh ' + adjustment.adjustmentCode}">Xem điều chỉnh</a><form th:if="${item.canCreateAdjustment() and adjustment == null}" th:action="@{/inventory-counts/{id}/create-adjustment(id=${item.id})}" method="post"><button class="btn btn-warning">Tạo điều chỉnh</button></form></div></div>
<table class="table table-hover align-middle"><thead><tr><th>Vật tư</th><th>Lô</th><th>Vị trí</th><th>Hệ thống</th><th>Thực tế</th><th>Chênh lệch</th></tr></thead><tbody><tr th:each="l:${item.lines}"><td th:text="${l.material.code + ' - ' + l.material.name}"></td><td th:text="${l.batch.batchNumber}"></td><td th:text="${l.location.code}"></td><td th:text="${l.systemQuantity}"></td><td th:text="${l.actualQuantity}"></td><td><span th:class="${l.differenceQuantity == 0 ? 'badge text-bg-success' : 'badge text-bg-warning'}" th:text="${l.differenceQuantity}"></span></td></tr></tbody></table></main></body></html>
