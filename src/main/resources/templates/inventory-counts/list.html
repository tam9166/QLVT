<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Kiểm kê kho')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid py-4"><div class="d-flex justify-content-between mb-3"><h1 class="h3">Kiểm kê kho</h1><a class="btn btn-primary" th:href="@{/inventory-counts/new}">Tạo kiểm kê</a></div>
<table class="table table-hover align-middle"><thead><tr><th>Mã</th><th>Kho</th><th>Trạng thái</th><th>Bắt đầu</th><th></th></tr></thead><tbody><tr th:each="i:${items}"><td><a th:href="@{/inventory-counts/{id}(id=${i.id})}" th:text="${i.countCode}"></a></td><td th:text="${i.warehouse.name}"></td><td><span class="badge text-bg-info" th:text="${i.status}"></span></td><td th:text="${#temporals.format(i.createdAt,'dd/MM/yyyy HH:mm')}"></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/inventory-counts/{id}(id=${i.id})}">Chi tiết</a></td></tr></tbody></table></main></body></html>
