<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Nhập kiểm kê')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container-fluid py-4"><h1 class="h3 mb-3" th:text="${'Nhập kết quả ' + item.countCode}"></h1><form th:action="@{/inventory-counts/{id}/lines(id=${item.id})}" method="post"><table class="table table-hover align-middle"><thead><tr><th>Vật tư</th><th>Lô</th><th>Vị trí</th><th>Hệ thống</th><th>Thực tế</th></tr></thead><tbody><tr th:each="l:${item.lines}"><td th:text="${l.material.code + ' - ' + l.material.name}"></td><td th:text="${l.batch.batchNumber}"></td><td th:text="${l.location.code}"></td><td th:text="${l.systemQuantity}"></td><td><input class="form-control form-control-sm" type="number" min="0" th:name="${'actual_' + l.id}" th:value="${l.actualQuantity}"></td></tr></tbody></table><button class="btn btn-primary">Lưu kết quả</button></form></main></body></html>
