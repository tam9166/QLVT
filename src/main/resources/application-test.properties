spring.datasource.url=${TEST_DB_URL:${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=QLVT_TEST;encrypt=true;trustServerCertificate=true}}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:tam}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=${TEST_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
server.error.include-message=never
